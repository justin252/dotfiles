# Workspace dev server port forwarding
# Setup: https://datadoghq.atlassian.net/wiki/spaces/DEVX/pages/5323785891
# Applied to all workspace SSH connections automatically.
# If two connections compete for the same port, SSH warns but connects fine.
Host workspace-*
    LocalForward 8443 localhost:8443
    LocalForward 8080 localhost:8080
