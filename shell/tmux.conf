# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g default-shell /bin/zsh

# Behavior
set -sg escape-time 0
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# Status bar: minimal
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=blue,bold]#S #[fg=default]| "
set -g status-left-length 30
set -g status-right "#(~/tools/ag-status-line)#[fg=green]#{b:pane_current_path}"
set -g status-right-length 80
set -g status-interval 5

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Copy mode (vi)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard 2>/dev/null || xsel --clipboard 2>/dev/null'"

# Agent dashboard (popup)
bind a display-popup -E -w 80% -h 80% "~/tools/ag"

# Reload
bind r source-file ~/.tmux.conf \; display "Reloaded"
